global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'django'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'celery'
    static_configs:
      - targets: ['localhost:9540']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


rule_files:
  - ./rules.yml
