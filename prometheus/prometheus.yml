global:
  scrape_interval:     5s   # pull metrics every 5 s (chaos spikes are short-lived)
  evaluation_interval: 15s  # evaluate alert rules every 15 s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: django
    metrics_path: /prom-metrics/
    static_configs:
      - targets: ['django:8000']
        labels:
          env: demo

  - job_name: mpesa-service
    metrics_path: /metrics
    static_configs:
      - targets: ['mpesa-service:8001']
        labels:
          env: demo

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
