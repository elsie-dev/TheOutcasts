# Flux GitRepository — points to this repo so Flux can watch for changes.
# Run `flux bootstrap` first; this file is for reference / declarative re-apply.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fixme-repo
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: develop
  url: https://github.com/MikeMwita/fixme-backend
  # For private repos, reference a Secret containing the SSH key or token:
  # secretRef:
  #   name: fixme-repo-auth
